# Site settings
title: "Oliver Cordingley"
description: "Oliver Cordingley is a multi-skilled Marketer & CRM Executive based in Nottingham, UK. and is currently available for new opportunities."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Oliver Cordingley"
resume_title:                   "CRM Executive"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "olivercordingley@me.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Nottingham, UK"

resume_header_contact_info:     ""
display_header_contact_info:    "false"

resume_header_intro: "<p>Adaptable and technical-minded early-career professional with a strong interest in CRM systems, automation and process improvement. I am recently qualified with a Level 4 Marketing Executive Apprenticeship, with over two years of hands-on CRM management experience.</p><p>Skilled in automating business functions, building customer journeys and using data to improve efficiency. Conscientious, curious and a team player eager to develop within marketing operations, CRM or business systems roles.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        false
resume_section_skills:          true
resume_section_recognition:     true
resume_section_links:           true
resume_section_associations:    false
# resume_section_interests:       true

