resume_header_intro: "<p>Junior-mid level full-stack developer with a backend focus, experienced in designing, building and maintaining production systems used by real users. Strong in JavaScript/TypeScript, Node.js and React/Next.js, with practical experience in relational schema design, API-led integrations and automation workflows.</p><p>Comfortable owning projects end to end, from requirements and system design through implementation, testing, deployment and ongoing maintenance. Keen to grow in a collaborative engineering team with strong technical standards. References available on request.</p>"

